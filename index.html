<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WallBall</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0f172a;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

#progressRing{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
#progressRing div{position:absolute;background:#22c55e;transition:width .2s,height .2s}
#pTop{top:0;left:0;height:6px;width:0%}
#pRight{top:0;right:0;width:6px;height:0%}
#pBottom{bottom:0;right:0;height:6px;width:0%}
#pLeft{bottom:0;left:0;width:6px;height:0%}

#main{position:relative;z-index:5;text-align:center}
#count{font-size:130px;font-weight:800;line-height:1;letter-spacing:-4px}
#target{font-size:36px;opacity:.6;margin-top:6px;border-top:2px solid rgba(255,255,255,.3);padding-top:6px;display:inline-block;min-width:90px}
#time{font-size:28px;margin-top:10px;opacity:.85;font-weight:600}
#avg{font-size:18px;margin-top:4px;opacity:.7;display:none}

#arrows{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:40px;z-index:10}
.arrow{font-size:72px;line-height:1;transition:color .2s,filter .2s}
#arrowUp{color:#ef4444}
#arrowDown{color:#ef4444}
#arrowUp.active{color:#4ade80;filter:drop-shadow(0 0 12px #4ade80)}
#arrowDown.active{color:#4ade80;filter:drop-shadow(0 0 12px #4ade80)}
.arrow-label{font-size:14px;opacity:.9;margin-top:2px;letter-spacing:1px}

#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:10}
#startRow{display:flex;gap:16px;justify-content:center}
.startBtn{padding:14px 28px;font-size:16px;background:#16a34a;color:#fff;border:none;border-radius:10px}
#switchBtn{padding:18px 56px;font-size:24px;font-weight:700;background:#2563eb;color:#fff;border:none;border-radius:14px;display:none}

#topBar{position:absolute;top:10px;left:10px;display:flex;gap:10px;z-index:20}
#refreshBtn,#resetBtn{padding:7px 12px;font-size:12px;background:#374151;color:#fff;border:none;border-radius:8px}
#resetBtn{display:none}
#status{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:14px;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:8px;z-index:10}

#flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .15s;z-index:8}
#flash.on{background:rgba(74,222,128,.3);opacity:1}

#confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:14px;opacity:0;animation:fall 3.5s ease-in forwards}
@keyframes fall{
  0%{transform:translateY(-30px) rotate(0deg);opacity:1}
  100%{transform:translateY(105vh) rotate(900deg);opacity:0.9}
}
</style>
</head>
<body>
<div id="progressRing">
  <div id="pTop"></div>
  <div id="pRight"></div>
  <div id="pBottom"></div>
  <div id="pLeft"></div>
</div>

<div id="topBar">
  <button id="refreshBtn">Refresh</button>
  <button id="resetBtn">Reset</button>
</div>
<div id="status">Waiting</div>

<div id="main">
  <div id="count">0</div>
  <div id="target">100</div>
  <div id="time">00:00</div>
  <div id="avg"></div>
</div>

<div id="arrows">
  <div>
    <div id="arrowUp" class="arrow">▲</div>
    <div class="arrow-label">TOP</div>
  </div>
  <div>
    <div id="arrowDown" class="arrow">▼</div>
    <div class="arrow-label">BOTTOM</div>
  </div>
</div>

<div id="controls">
  <div id="startRow">
    <button class="startBtn" id="startUp">TOP Start</button>
    <button class="startBtn" id="startDown">BOTTOM Start</button>
  </div>
  <button id="switchBtn">Switch</button>
</div>

<div id="flash"></div>
<div id="confetti"></div>

<script>
const ESP_IP = "192.168.4.1";
const TARGET = 100;
const countEl = document.getElementById("count");
const targetEl = document.getElementById("target");
const timeEl = document.getElementById("time");
const avgEl = document.getElementById("avg");
const statusEl = document.getElementById("status");
const flash = document.getElementById("flash");
const startUpBtn = document.getElementById("startUp");
const startDownBtn = document.getElementById("startDown");
const startRow = document.getElementById("startRow");
const switchBtn = document.getElementById("switchBtn");
const resetBtn = document.getElementById("resetBtn");
const refreshBtn = document.getElementById("refreshBtn");
const arrowUp = document.getElementById("arrowUp");
const arrowDown = document.getElementById("arrowDown");
const confetti = document.getElementById("confetti");

let started = false;
let running = false;
let startTime = 0;
let total = 0;
let lastSeenLeft = 0, lastSeenRight = 0;
let activeSide = "up";
let done = false;

function updateArrows() {
  arrowUp.className = "arrow";
  arrowDown.className = "arrow";
  if (activeSide === "up") {
    arrowUp.classList.add("active");
  } else {
    arrowDown.classList.add("active");
  }
}

function updateProgress() {
  const pct = Math.min(total / TARGET, 1);
  const pTop = document.getElementById("pTop");
  const pRight = document.getElementById("pRight");
  const pBottom = document.getElementById("pBottom");
  const pLeft = document.getElementById("pLeft");

  if (pct <= 0.25) {
    pTop.style.width = (pct / 0.25 * 100) + "%";
    pRight.style.height = "0%";
    pBottom.style.width = "0%";
    pLeft.style.height = "0%";
  } else if (pct <= 0.5) {
    pTop.style.width = "100%";
    pRight.style.height = ((pct - 0.25) / 0.25 * 100) + "%";
    pBottom.style.width = "0%";
    pLeft.style.height = "0%";
  } else if (pct <= 0.75) {
    pTop.style.width = "100%";
    pRight.style.height = "100%";
    pBottom.style.width = ((pct - 0.5) / 0.25 * 100) + "%";
    pLeft.style.height = "0%";
  } else {
    pTop.style.width = "100%";
    pRight.style.height = "100%";
    pBottom.style.width = "100%";
    pLeft.style.height = ((pct - 0.75) / 0.25 * 100) + "%";
  }
}

function doFlash() {
  flash.classList.add("on");
  setTimeout(() => flash.classList.remove("on"), 160);
}

function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = ["#f87171","#4ade80","#60a5fa","#fbbf24","#a78bfa","#f472b6"][i % 6];
    piece.style.animationDelay = (Math.random() * 0.5) + "s";
    piece.style.animationDuration = (2.8 + Math.random() * 1.5) + "s";
    confetti.appendChild(piece);
    setTimeout(() => piece.remove(), 4500);
  }
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function updateTimer() {
  if (!running) return;
  const elapsed = Date.now() - startTime;
  timeEl.textContent = formatTime(elapsed);
}

function addCount() {
  if (done) return;
  total++;
  countEl.textContent = total;
  updateProgress();
  doFlash();
  if (total >= TARGET) {
    done = true;
    running = false;
    const elapsed = Date.now() - startTime;
    const avgSec = (elapsed / total / 1000).toFixed(2);
    avgEl.textContent = "Avg: " + avgSec + "s";
    avgEl.style.display = "block";
    statusEl.textContent = "Done!";
    launchConfetti();
  }
}

function updateUI() {
  if (!started) {
    startRow.style.display = "flex";
    switchBtn.style.display = "none";
    resetBtn.style.display = "none";
  } else {
    startRow.style.display = "none";
    switchBtn.style.display = "block";
    resetBtn.style.display = "block";
  }
  updateArrows();
}

async function pollESP() {
  if (!started || done) return;
  try {
    const res = await fetch(`http://${ESP_IP}/status`, {cache:"no-store"});
    const data = await res.json();
    statusEl.textContent = "ESP Connected";

    if (activeSide === "up" && (data.lastRight||0) > lastSeenRight) {
      lastSeenRight = data.lastRight;
      addCount();
    }
    if (activeSide === "down" && (data.lastLeft||0) > lastSeenLeft) {
      lastSeenLeft = data.lastLeft;
      addCount();
    }
  } catch(e) {
    statusEl.textContent = "No ESP";
  }
}

function startWithSide(side) {
  if (started) return;
  started = true;
  running = true;
  startTime = Date.now();
  activeSide = side;
  statusEl.textContent = "Started";
  updateUI();
}

startUpBtn.onclick = () => startWithSide("up");
startDownBtn.onclick = () => startWithSide("down");

switchBtn.onclick = () => {
  if (!started) return;
  activeSide = activeSide === "up" ? "down" : "up";
  updateUI();
};

resetBtn.onclick = () => {
  started = false;
  running = false;
  done = false;
  total = 0;
  countEl.textContent = "0";
  timeEl.textContent = "00:00";
  avgEl.style.display = "none";
  lastSeenLeft = lastSeenRight = 0;
  activeSide = "up";
  document.getElementById("pTop").style.width = "0%";
  document.getElementById("pRight").style.height = "0%";
  document.getElementById("pBottom").style.width = "0%";
  document.getElementById("pLeft").style.height = "0%";
  confetti.innerHTML = "";
  statusEl.textContent = "Reset";
  updateUI();
};

refreshBtn.onclick = async () => {
  statusEl.textContent = "Refreshing...";
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch (e) {}
  const url = location.origin + location.pathname + "?t=" + Date.now();
  location.replace(url);
};

targetEl.textContent = TARGET;
updateUI();
setInterval(pollESP, 150);
setInterval(updateTimer, 200);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WallBall</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#111;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden}
body{display:flex;flex-direction:row}

#left,#right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s}
#left{background:#14532d}
#right{background:#14532d}
#left.paused{background:#7f1d1d}
#right.paused{background:#7f1d1d}

.label{font-size:28px;opacity:.9;margin-bottom:8px}
.num{font-size:140px;font-weight:800;line-height:1}
.startBtn{margin-top:20px;padding:16px 40px;font-size:20px;background:#16a34a;color:#fff;border:none;border-radius:12px}

#center{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:10}
#time{font-size:36px;background:rgba(0,0,0,.7);padding:8px 20px;border-radius:12px;margin-top:12px}
#switchBtn{margin-top:12px;padding:14px 36px;font-size:20px;background:#2563eb;color:#fff;border:none;border-radius:12px;display:none}
#resetBtn{margin-top:8px;padding:12px 28px;font-size:18px;background:#dc2626;color:#fff;border:none;border-radius:12px;display:none}
#refreshBtn{margin-top:8px;padding:10px 20px;font-size:14px;background:#374151;color:#fff;border:none;border-radius:10px}
#status{margin-top:8px;font-size:16px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:8px}

#flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .15s;z-index:5}
#flash.green{background:rgba(74,222,128,.25);opacity:1}
#flash.red{background:rgba(248,113,113,.25);opacity:1}
</style>
</head>
<body>
<div id="left">
  <div class="label">女 (34)</div>
  <div class="num" id="countLeft">0</div>
  <button class="startBtn" id="startLeft">开始</button>
</div>

<div id="right">
  <div class="label">男 (35)</div>
  <div class="num" id="countRight">0</div>
  <button class="startBtn" id="startRight">开始</button>
</div>

<div id="center">
  <div id="time">00:00</div>
  <button id="switchBtn">交换</button>
  <button id="resetBtn">重置</button>
  <button id="refreshBtn">强制刷新</button>
  <div id="status">等待开始</div>
</div>
<div id="flash"></div>

<script>
const ESP_IP = "192.168.4.1";
const countLeftEl = document.getElementById("countLeft");
const countRightEl = document.getElementById("countRight");
const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");
const flash = document.getElementById("flash");
const startLeftBtn = document.getElementById("startLeft");
const startRightBtn = document.getElementById("startRight");
const switchBtn = document.getElementById("switchBtn");
const resetBtn = document.getElementById("resetBtn");
const refreshBtn = document.getElementById("refreshBtn");
const leftPanel = document.getElementById("left");
const rightPanel = document.getElementById("right");

let started = false;
let running = false;
let startTime = 0;
let validLeft = 0, validRight = 0;
let lastSeenLeft = 0, lastSeenRight = 0;
let pauseLeft = false, pauseRight = false;

function updateUI() {
  leftPanel.classList.toggle("paused", pauseLeft);
  rightPanel.classList.toggle("paused", pauseRight);

  if (!started) {
    startLeftBtn.style.display = "block";
    startRightBtn.style.display = "block";
    switchBtn.style.display = "none";
    resetBtn.style.display = "none";
  } else {
    startLeftBtn.style.display = "none";
    startRightBtn.style.display = "none";
    switchBtn.style.display = "block";
    resetBtn.style.display = "block";
  }
}

async function pollESP() {
  if (!started) return;
  try {
    const res = await fetch(`http://${ESP_IP}/status`, {cache:"no-store"});
    const data = await res.json();
    statusEl.textContent = "已连接 ESP";

    if (!pauseLeft && (data.lastLeft||0) > lastSeenLeft) {
      lastSeenLeft = data.lastLeft;
      validLeft++;
      countLeftEl.textContent = validLeft;
      flash.className = "green";
      setTimeout(() => flash.className = "", 150);
    }
    if (!pauseRight && (data.lastRight||0) > lastSeenRight) {
      lastSeenRight = data.lastRight;
      validRight++;
      countRightEl.textContent = validRight;
      flash.className = "green";
      setTimeout(() => flash.className = "", 150);
    }
  } catch(e) {
    statusEl.textContent = "无法连接 ESP";
  }
}

function updateTimer() {
  if (!running) return;
  const s = Math.floor((Date.now()-startTime)/1000);
  timeEl.textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

function startWithSide(side) {
  if (started) return;
  started = true;
  running = true;
  startTime = Date.now();
  statusEl.textContent = "已开始";

  if (side === "left") {
    pauseLeft = false;
    pauseRight = true;
  } else {
    pauseRight = false;
    pauseLeft = true;
  }
  updateUI();
}

startLeftBtn.onclick = () => startWithSide("left");
startRightBtn.onclick = () => startWithSide("right");

switchBtn.onclick = () => {
  if (!started) return;
  // 交换：当前继续的那一方暂停，另一方继续
  if (pauseLeft) {
    pauseLeft = false;
    pauseRight = true;
  } else {
    pauseLeft = true;
    pauseRight = false;
  }
  updateUI();
};

resetBtn.onclick = () => {
  started = false;
  running = false;
  validLeft = validRight = 0;
  countLeftEl.textContent = countRightEl.textContent = "0";
  timeEl.textContent = "00:00";
  lastSeenLeft = lastSeenRight = 0;
  pauseLeft = pauseRight = false;
  updateUI();
  statusEl.textContent = "已重置";
};

refreshBtn.onclick = () => {
  if ('caches' in window) {
    caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => location.reload(true));
  } else {
    location.reload(true);
  }
};

updateUI();
setInterval(pollESP, 150);
setInterval(updateTimer, 200);
</script>
</body>
</html>
